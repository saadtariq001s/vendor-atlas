# Vendor Atlas on one always-on PC.
#
#   cp .env.docker.example .env      # then fill it in
#   docker compose up -d --build     # app on http://localhost:3000
#
# Reaching it from outside the office (phone, hotel wifi, a conference) is
# done by a tunnel, which needs no router changes and no open ports:
#
#   docker compose --profile tunnel up -d     # named Cloudflare tunnel, fixed address
#   docker compose --profile quick up -d      # free random address, email code first
#
# See README.md ▸ "Run it on an office PC".

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Vendor Atlas}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD}@db:5432/atlas
      DATABASE_SSL: disable
      # Creates the first administrator on an empty database, then ignored.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    # Bound to this computer only: nothing else on the network or the internet
    # can open it. Reaching it from outside goes through a tunnel profile
    # below, which talks to the app inside Docker and needs no open port.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # A copy of the whole database every day, in the backups folder next to
  # this file; the last 30 days are kept. To restore one, see README.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/vendor-atlas-$$(date +%Y-%m-%d).sql.gz
          if pg_dump -h db -U atlas -d atlas --no-owner --clean --if-exists | gzip > "$$f.part"; then
            mv "$$f.part" "$$f" && echo "backup saved: $$f"
          else
            rm -f "$$f.part"; echo "backup FAILED"
          fi
          find /backups -name 'vendor-atlas-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done

  # A fixed public address (https://vendors.your-domain.com) through a free
  # Cloudflare account. Create the tunnel once in the Cloudflare dashboard,
  # point its public hostname at http://app:3000, and paste its token into
  # .env as TUNNEL_TOKEN.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}

  # Free, no account: a random https://….trycloudflare.com address that leads
  # to the app's own sign-in page. With ALLOWED_EMAILS set, Cloudflare also
  # asks those emails for a one-time code first (a new Cloudflare feature;
  # leave it empty if its sign-in misbehaves). The address changes when this
  # container restarts; "Show web address.bat" prints the current one.
  quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    restart: unless-stopped
    depends_on:
      - app
    # The metrics port also answers /quicktunnel with the current address,
    # which the link service below reads.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://app:3000 ${ALLOWED_EMAILS:+--allowed-mail $ALLOWED_EMAILS}

  # A permanent link for the changing quick-tunnel address: a GitHub Pages
  # page (LINK_REPO) whose current.json this service rewrites whenever the
  # address changes, so https://<owner>.github.io/<repo>/ always forwards to
  # the app. LINK_TOKEN: a fine-grained GitHub token with Contents read and
  # write on that one repository only. Without both, it does nothing.
  #
  # It also watches the address: Cloudflare drops a quick tunnel after the
  # PC sleeps or loses its connection, while the tunnel container keeps
  # running. After 4 failed checks in a row (about 4 minutes) it restarts
  # the tunnel through the Docker socket, and the new address is published.
  link:
    image: alpine:3.20
    profiles: ["quick"]
    restart: unless-stopped
    depends_on:
      - quick
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LINK_REPO: ${LINK_REPO:-}
      LINK_TOKEN: ${LINK_TOKEN:-}
      QUICK_STATUS: http://quick:20241/quicktunnel
      GITHUB_API: https://api.github.com
      DOCKER_SOCK: /var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$LINK_REPO" ] || [ -z "$$LINK_TOKEN" ]; then
          echo "link: LINK_REPO or LINK_TOKEN not set in .env, so no permanent link is published"
          exec sleep 2147483647
        fi
        until command -v curl >/dev/null || apk add --no-cache -q curl >/dev/null 2>&1; do echo "link: waiting for internet"; sleep 30; done
        api="$$GITHUB_API/repos/$$LINK_REPO/contents/current.json"
        auth="Authorization: Bearer $$LINK_TOKEN"
        last=""
        fails=0
        restart_tunnel() {
          id=$$(curl -sS --unix-socket "$$DOCKER_SOCK" -G "http://docker/containers/json" \
                --data-urlencode 'filters={"label":["com.docker.compose.service=quick"]}' \
                | sed -n 's/^\[{"Id":"\([0-9a-f]*\)".*/\1/p')
          if [ -n "$$id" ] && curl -fsS --unix-socket "$$DOCKER_SOCK" -X POST "http://docker/containers/$$id/restart?t=5" >/dev/null; then
            echo "link: the address stopped answering, so the tunnel was restarted"
          else
            echo "link: the address stopped answering, and the tunnel could not be restarted"
          fi
        }
        while true; do
          host=$$(curl -fsS -m 10 "$$QUICK_STATUS" 2>/dev/null | sed -n 's/.*"hostname": *"\([^"]*\)".*/\1/p')
          if [ -n "$$host" ] && [ "$$host" != "$$last" ]; then
            url="https://$$host"
            sha=$$(curl -sS -m 20 -H "$$auth" -H "User-Agent: vendor-atlas-link" "$$api" | sed -n 's/.*"sha": *"\([0-9a-f]*\)".*/\1/p' | head -n 1)
            body=$$(printf '{"url":"%s","updated":"%s"}\n' "$$url" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" | base64 | tr -d '\n')
            res=$$(curl -sS -m 20 -w '\n%{http_code}' -X PUT -H "$$auth" -H "Accept: application/vnd.github+json" \
                 -H "User-Agent: vendor-atlas-link" "$$api" \
                 -d "{\"message\":\"Vendor Atlas is at $$url\",\"content\":\"$$body\",\"sha\":\"$$sha\"}")
            code=$$(printf '%s' "$$res" | tail -n 1)
            if [ "$$code" = "200" ] || [ "$$code" = "201" ]; then
              echo "link: published $$url"
              last="$$host"
              fails=0
            else
              why=$$(printf '%s' "$$res" | sed -n 's/.*"message": *"\([^"]*\)".*/\1/p' | head -n 1)
              echo "link: GitHub refused (HTTP $$code: $$why); token starts $$(printf '%s' "$$LINK_TOKEN" | cut -c1-15)…; trying again in a minute"
            fi
          elif [ -n "$$host" ]; then
            if curl -fs -m 15 -o /dev/null "https://$$host/api/health"; then
              fails=0
            else
              fails=$$((fails + 1))
              [ "$$fails" -ge 4 ] && { restart_tunnel; fails=0; last=""; sleep 30; }
            fi
          fi
          sleep 60
        done

volumes:
  pgdata:
